spring.datasource.url=jdbc:h2:mem:restaurant-service;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

restro.security.default-admin-password=test-admin
restro.security.default-manager-password=test-manager
restro.security.default-kitchen-password=test-kitchen
