# Production configuration. Set these values in the hosting provider's secret/env-var UI;
# never commit database credentials to this repository.
spring.datasource.url=${DB_URL:jdbc:mysql://restro-rpm-projects.g.aivencloud.com:14662/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Aiven requires encrypted database connections. sslMode=REQUIRED enables TLS for
# MySQL Connector/J; use VERIFY_IDENTITY only after configuring the Aiven CA certificate.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${PORT:8081}
