spring.application.name=restaurant-service
# A plain IDE launch should be usable without a local MySQL installation.
# Deployment environments can override this with SPRING_PROFILES_ACTIVE.
spring.profiles.default=local

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/microservices}
spring.datasource.username=${DB_USERNAME:spring}
spring.datasource.password=${DB_PASSWORD:spring}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

restro.bootstrap-admin.username=${RESTRO_BOOTSTRAP_ADMIN_USERNAME:}
restro.bootstrap-admin.password=${RESTRO_BOOTSTRAP_ADMIN_PASSWORD:}
restro.bootstrap-admin.name=${RESTRO_BOOTSTRAP_ADMIN_NAME:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
restro.kafka.order-topic=${RESTRO_KAFKA_ORDER_TOPIC:restro.order-events}
