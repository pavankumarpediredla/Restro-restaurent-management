<div class="shell">
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-mark">R</span>
      <span class="logo-word">Restro</span>
    </div>

    <nav>
      @for (item of visibleNav; track item.path) {
        <a class="nav-item" [routerLink]="item.path" routerLinkActive="active">
          <span class="nav-icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="search">
        <span class="search-icon">S</span>
        <input type="text" placeholder="Search orders, items, customers" />
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" type="button" title="Notifications">N</button>
        <div class="profile">
          <span class="avatar">{{ avatar }}</span>
          <div class="profile-info">
            <span class="profile-name">{{ displayName }}</span>
            <span class="profile-role">{{ profileRole }}</span>
          </div>
          <button class="logout-btn" type="button" (click)="logout()" title="Log out">
            Logout
          </button>
        </div>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>

    <footer class="app-footer">
      <span>Restro POS · v0.1.0</span>
      <span>&copy; {{ year }} Restro. All systems normal.</span>
    </footer>
  </div>
</div>
