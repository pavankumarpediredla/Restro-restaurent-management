<footer class="pagination"><span>Showing {{ total ? (page - 1) * pageSize + 1 : 0 }}-{{ lastShown }} of {{ total }} employees</span><nav aria-label="Attendance report pages"><button type="button" aria-label="Previous page" (click)="setPage(page - 1)" [disabled]="page === 1">‹</button>@for (item of pages; track item) { <button type="button" [class.active]="item === page" [attr.aria-label]="'Page ' + item" (click)="setPage(item)">{{ item }}</button> }<button type="button" aria-label="Next page" (click)="setPage(page + 1)" [disabled]="page === totalPages">›</button></nav></footer>
