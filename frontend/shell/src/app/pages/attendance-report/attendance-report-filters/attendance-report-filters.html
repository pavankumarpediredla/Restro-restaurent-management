<div class="backdrop" (click)="close.emit()"><section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title" (click)="$event.stopPropagation()"><header><h3 id="filter-title">Filter attendance report</h3><button type="button" aria-label="Close filters" (click)="close.emit()">×</button></header><label>Employee<select [(ngModel)]="filters.employee"><option value="">All employees</option>@for (employee of employees; track employee.staffId) { <option [value]="employee.staffId">{{ employee.name }}</option> }</select></label><label>Employee status<select [(ngModel)]="filters.employeeStatus"><option value="ALL">All statuses</option><option value="ACTIVE">Active</option><option value="INACTIVE">Ex-Employee</option></select></label><label>Attendance status<select [(ngModel)]="filters.attendanceStatus"><option value="ALL">All attendance statuses</option>@for (status of statuses; track status) { <option [value]="status">{{ config[status].code }} — {{ config[status].label }}</option> }</select></label><footer><button type="button" class="secondary" (click)="reset.emit()">Reset</button><button type="button" class="primary" (click)="applyFilters(); close.emit()">Apply filters</button></footer></section></div>
