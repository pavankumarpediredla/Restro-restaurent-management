<div class="login-page">
  <form class="login-card" (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div class="brand">
      <span class="brand-mark">R</span>
      <h1>Restro POS</h1>
    </div>
    <p class="subtitle">Sign in with your backend account</p>

    <label>
      Username
      <input
        type="text"
        name="username"
        [(ngModel)]="username"
        placeholder="admin"
        autocomplete="username"
        required
      />
    </label>

    <label>
      Password
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="********"
        autocomplete="current-password"
        required
      />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading() || loginForm.invalid">
      {{ loading() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
</div>
